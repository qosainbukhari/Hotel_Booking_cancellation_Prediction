name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true

      # Tests run the real pipeline (MLflow registry, Optuna, Pandera, Evidently), so CI
      # installs the dev and train groups. The Docker image installs runtime packages only.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Test
        run: uv run --no-sync pytest --cov=hotel_cancellation --cov=api --cov-report=term-missing
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
