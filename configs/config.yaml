# File locations used by the pipeline. Relative paths are resolved from the project root.
artifacts_root: artifacts

data_ingestion:
  raw_data_path: data/raw/hotel_bookings.csv
  root_dir: artifacts/data_ingestion

data_validation:
  root_dir: artifacts/data_validation

data_transformation:
  root_dir: artifacts/data_transformation

model_trainer:
  root_dir: artifacts/model_trainer

model_evaluation:
  root_dir: artifacts/model_evaluation

model_registry:
  # Name of the model in the MLflow Model Registry; the live version carries the alias below.
  registered_model_name: hotel-cancellation
  production_alias: production
  # The production version is exported here as a small bundle the API and Docker image load,
  # so serving never needs MLflow.
  serving_dir: artifacts/serving
